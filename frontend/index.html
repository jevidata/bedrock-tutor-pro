<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Tutor Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Bedrock Tutor Pro</h1>
            <p>Tu asistente inteligente de Big Data y Cloud</p>
            <p class="copyright">&copy; 2026 Jesús Vila - JeviData</p>
        </header>

        <div class="chat-card">
            <label for="question">¿En qué puedo ayudarte hoy?</label>
            <textarea id="question" rows="4" placeholder="Escribe aquí tu duda..."></textarea>
            
            <button id="send-btn">Enviar Consulta</button>

            <div id="loading">
                <div class="spinner"></div>
                <span>El tutor está pensando...</span>
            </div>

            <div class="response-section">
                <h2>Respuesta del tutor:</h2>
                <div id="answer" class="answer-box">Esperando tu pregunta...</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
